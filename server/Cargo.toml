[package]
name = "caper-server"
version.workspace = true
edition.workspace = true
description = "caper server - static + HMR (rustex1 devserver) with the harness embedded; one process, no proxy"

[[bin]]
name = "caper-server"
path = "src/main.rs"

[dependencies]
rustex1-devserver = { path = "../vendor/rustex1/devserver" }
# The harness runs IN this process: the chat app is one server, not a web tier
# in front of a separate agent daemon.
angela = { path = "../vendor/angela-rs" }
agl = { path = "../vendor/agl-rs" }
serde_json = "1"
regex = "1"
rusqlite = "0.42"
# Automation schedules are cron expressions; `cron` parses them and finds the
# next fire time. `chrono` comes with it but is named so local times work.
cron = "0.12"
chrono = "0.4"
