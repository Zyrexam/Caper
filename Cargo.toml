[workspace]
resolver = "2"
members = ["app", "server", "crates/*"]
# Vendored dependencies are their own packages/workspaces, not members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.wasm]
inherits = "release"
opt-level = "s"
debug = false
strip = "debuginfo"
codegen-units = 16
lto = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
debug = 1
